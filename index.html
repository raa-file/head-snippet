<style>
:root{
  --navy:#1A2740;--navy2:#2E4A7D;--gold:#E3A83B;--gold2:#F8D57E;
  --bg:#F6F3EC;--card:#fff;--ink:#1A2740;--muted:#6B7385;--line:#E6E1D6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.7;min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer}
a{color:inherit}

/* Header */
header{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
.top{max-width:860px;margin:auto;display:flex;align-items:center;gap:12px}
.top img{width:44px;height:44px;border-radius:11px;cursor:pointer}
.brand{cursor:pointer}
.brand h1{margin:0;font-size:22px;font-weight:800;line-height:1.2}
.brand p{margin:0;font-size:13px;color:var(--gold2)}

main{max-width:860px;margin:auto;padding:18px 16px 40px}

/* Breadcrumb */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:14px}
.crumbs button{background:none;border:0;padding:0;color:var(--navy2);font-weight:700}
.crumbs span.sep{opacity:.5}

.title{font-size:24px;font-weight:800;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}

/* Lists */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:right;
  display:flex;align-items:center;gap:12px;width:100%;transition:.15s;color:var(--ink)}
.item:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 18px #1a274014}
.item .ic{width:46px;height:46px;border-radius:12px;background:#F3EBD8;display:grid;place-items:center;font-size:24px;flex:none}
.item b{display:block;font-size:17px}
.item small{color:var(--muted);font-size:13px}
.item .arr{margin-inline-start:auto;color:var(--gold);font-size:20px}

/* Lesson options */
.opts{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(max-width:520px){.opts{grid-template-columns:1fr 1fr;gap:10px}}
.opt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 14px;text-align:center;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--gold);transform:translateY(-2px)}
.opt .e{font-size:34px;display:block}
.opt b{display:block;font-size:17px;margin-top:6px}
.opt small{color:var(--muted);font-size:13px;line-height:1.5;display:block}
.prep{margin-top:14px;width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:800;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--navy);box-shadow:0 6px 18px #e3a83b55}

/* Content panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel h3{margin:0 0 8px;font-size:19px}
.panel ul{margin:0;padding-inline-start:20px}
.panel li{margin:4px 0}
.terms{display:grid;gap:8px;margin-top:10px}
.term{background:#FAF7F0;border-radius:12px;padding:10px 12px}
.term b{color:var(--navy2)}
.q{border-bottom:1px dashed var(--line);padding:12px 0}
.q:last-child{border:0}
.q .a{display:none;margin-top:6px;background:#EEF6EE;color:#2B6A3B;border-radius:10px;padding:8px 12px;font-weight:500}
.show .q .a{display:block}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--navy)}
.big{font-size:20px;font-weight:700;background:#FAF7F0;border-radius:14px;padding:16px;border-inline-start:5px solid var(--gold)}
.lines{margin-top:10px}
.lines div{border-bottom:1px solid #ccc;height:30px}
.ws-item{margin:14px 0}
.empty{color:var(--muted);text-align:center;padding:30px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px}

/* Print */
.print-head{display:none}
@media print{
  header,.crumbs,.btns,.noprint,footer{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .panel{border:0;padding:0;margin-bottom:18px;page-break-inside:avoid}
  .print-head{display:block;border-bottom:2px solid #000;margin-bottom:14px;padding-bottom:6px}
  .q .a{display:block!important;background:none;padding:0;color:#000}
  .hide-ans .q .a{display:none!important}
}
</style>
</head>

/* ================= المحرك ================= */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function go(h){ location.hash = h; }
window.addEventListener('hashchange', render);

function find(p){
  const c = DATA.find(x=>x.id===p[0]);
  const u = c && c.units.find(x=>x.id===p[1]);
  const l = u && u.lessons.find(x=>x.id===p[2]);
  return {c,u,l};
}
function crumbs(c,u,l,extra){
  const parts = [`<button onclick="go('')">المقررات</button>`];
  if(c) parts.push(`<button onclick="go('${c.id}')">${esc(c.name)}</button>`);
  if(u) parts.push(`<button onclick="go('${c.id}/${u.id}')">${esc(u.name)}</button>`);
  if(l) parts.push(`<button onclick="go('${c.id}/${u.id}/${l.id}')">${esc(l.name)}</button>`);
  if(extra) parts.push(`<span>${extra}</span>`);
  return `<nav class="crumbs">${parts.join('<span class="sep">‹</span>')}</nav>`;
}
const item = (onclick, icon, title, sub) =>
  `<button class="item" onclick="${onclick}"><span class="ic">${icon}</span><span><b>${esc(title)}</b><small>${esc(sub)}</small></span><span class="arr">‹</span></button>`;

function render(){
  const p = location.hash.slice(1).split('/').filter(Boolean).map(decodeURIComponent);
  const {c,u,l} = find(p);
  window.scrollTo(0,0);

  if(!p.length){
    app.innerHTML = `<h2 class="title">اختاري المقرر</h2><p class="sub">ثم الوحدة، ثم الدرس.</p>
      <div class="grid">${DATA.map(x=>item(`go('${x.id}')`, x.emoji||'📘', x.name, x.grade)).join('')}</div>`;
    return;
  }
  if(!c){ go(''); return; }
  if(p.length===1){
    app.innerHTML = crumbs(c) + `<h2 class="title">${esc(c.name)}</h2><p class="sub">${esc(c.grade)} — اختاري الوحدة</p>
      <div class="grid">${c.units.map((x,i)=>item(`go('${c.id}/${x.id}')`, i+1, x.name, x.lessons.length+' دروس')).join('')}</div>`;
    return;
  }
  if(!u){ go(c.id); return; }
  if(p.length===2){
    app.innerHTML = crumbs(c,u) + `<h2 class="title">${esc(u.name)}</h2><p class="sub">اختاري الدرس</p>
      <div class="grid">${u.lessons.map((x,i)=>item(`go('${c.id}/${u.id}/${x.id}')`, i+1, x.name, 'الدرس '+(i+1))).join('')}</div>`;
    return;
  }
  if(!l){ go(c.id+'/'+u.id); return; }
  const base = `${c.id}/${u.id}/${l.id}`;
  const view = p[3];

  if(!view){
    const opt = (v,e,t,s)=>`<button class="opt" onclick="go('${base}/${v}')"><span class="e">${e}</span><b>${t}</b><small>${s}</small></button>`;
    app.innerHTML = crumbs(c,u) + `<h2 class="title">${esc(l.name)}</h2><p class="sub">${esc(c.name)} · ${esc(u.name)}</p>
      <div class="opts">
        ${opt('summary','📄','ملخص الدرس','أهم المعلومات في صفحة واحدة')}
        ${opt('warmup','💡','تمهيد جاهز','سؤال أو فكرة لبدء الحصة')}
        ${opt('quiz','✅','تقويم سريع','أسئلة قصيرة مع الإجابات')}
        ${opt('worksheet','📝','ورقة عمل','جاهزة للطباعة أو التحميل')}
      </div>
      <button class="prep" onclick="go('${base}/prep')">🔑 جهّزي حصتي</button>`;
    return;
  }

  const head = `<div class="print-head"><b>${esc(l.name)}</b> — ${esc(c.name)} · ${esc(c.grade)} · ${esc(u.name)}</div>`;
  const printBtn = (label='🖨️ طباعة') => `<button class="btn" onclick="window.print()">${label}</button>`;
  const back = `<button class="btn ghost" onclick="go('${base}')">رجوع للدرس</button>`;

  if(view==='summary'){
    app.innerHTML = crumbs(c,u,l,'ملخص الدرس') + head + summaryHTML(l) + `<div class="btns">${printBtn()}${back}</div>`;
  } else if(view==='warmup'){
    app.innerHTML = crumbs(c,u,l,'تمهيد جاهز') + head + warmupHTML(l) + `<div class="btns">${printBtn()}${back}</div>`;
  } else if(view==='quiz'){
    app.innerHTML = crumbs(c,u,l,'تقويم سريع') + head + quizHTML(l,false) +
      `<div class="btns"><button class="btn" id="tg" onclick="toggleAns()">إظهار الإجابات</button>
       <button class="btn ghost" onclick="printQuiz(false)">🖨️ طباعة بدون إجابات</button>
       <button class="btn ghost" onclick="printQuiz(true)">🖨️ طباعة مع الإجابات</button>${back}</div>`;
  } else if(view==='worksheet'){
    const w = l.worksheet||{};
    const dl = w.url ? `<a class="btn" href="${esc(w.url)}" target="_blank" rel="noopener">⬇️ تحميل الملف</a>` : '';
    app.innerHTML = crumbs(c,u,l,'ورقة عمل') + head + worksheetHTML(l) +
      `<div class="btns">${dl}${printBtn('🖨️ طباعة الورقة')}${back}</div>`;
  } else if(view==='prep'){
    app.innerHTML = crumbs(c,u,l,'جهّزي حصتي') + head +
      `<p class="sub noprint">كل ما يخص الدرس في صفحة واحدة قابلة للطباعة.</p>
       <div style="display:grid;gap:14px">
         ${warmupHTML(l)}${summaryHTML(l)}${quizHTML(l,true)}${worksheetHTML(l)}
       </div>
       <div class="btns">${printBtn('🖨️ طباعة الحصة كاملة')}<button class="btn ghost" onclick="copyLink()">🔗 نسخ رابط الدرس</button>${back}</div>`;
  } else go(base);
}

function summaryHTML(l){
  const s = l.summary||{};
  return `<section class="panel"><h3>📄 ملخص الدرس</h3>
    ${s.intro?`<p>${esc(s.intro)}</p>`:''}
    ${s.points?.length?`<ul>${s.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${s.terms?.length?`<div class="terms">${s.terms.map(([t,d])=>`<div class="term"><b>${esc(t)}:</b> ${esc(d)}</div>`).join('')}</div>`:''}
  </section>`;
}
function warmupHTML(l){
  const w = l.warmup||{};
  return `<section class="panel"><h3>💡 تمهيد جاهز</h3>
    ${w.question?`<div class="big">${esc(w.question)}</div>`:''}
    ${w.idea?`<p><b>فكرة بديلة:</b> ${esc(w.idea)}</p>`:''}
  </section>`;
}
function quizHTML(l,showAns){
  const q = l.quiz||[];
  return `<section class="panel ${showAns?'show':''}" id="quiz"><h3>✅ تقويم سريع</h3>
    ${q.map((x,i)=>`<div class="q"><b>${i+1}. ${esc(x.q)}</b><div class="a">الإجابة: ${esc(x.a)}</div></div>`).join('')}
  </section>`;
}
function worksheetHTML(l){
  const w = l.worksheet||{};
  return `<section class="panel"><h3>📝 ورقة عمل</h3>
    <p>الاسم: ........................................ الفصل: ............</p>
    ${(w.items||[]).map((x,i)=>`<div class="ws-item"><b>${i+1}. ${esc(x)}</b><div class="lines"><div></div><div></div><div></div></div></div>`).join('')}
    ${w.url && !(w.items||[]).length ? `<p>الملف متاح للتحميل.</p>`:''}
  </section>`;
}
function toggleAns(){
  const q = document.getElementById('quiz'); q.classList.toggle('show');
  document.getElementById('tg').textContent = q.classList.contains('show') ? 'إخفاء الإجابات' : 'إظهار الإجابات';
}
function printQuiz(withAns){
  document.body.classList.toggle('hide-ans', !withAns);
  window.print();
  setTimeout(()=>document.body.classList.remove('hide-ans'), 500);
}
function copyLink(){
  const url = location.href.replace(/\/prep$/,'');
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
    .then(()=>alert('تم نسخ رابط الدرس'))
    .catch(()=>prompt('انسخي الرابط:', url));
}
render();
</script>
</body>
</html>
